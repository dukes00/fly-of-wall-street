[project]
name = "fruitfly"
version = "0.1.0"
description = "Fruit Fly of Wall Street: a connectome-driven, emotion-free market simulator."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "yfinance",
    "alpaca-py",
    "fastapi",
    "uvicorn[standard]",
    "scikit-learn",
    "python-dotenv",
    "requests",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitfly"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
